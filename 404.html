<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>

    <!-- Cloudflare Web Analytics -->
    <script type='module'
            src='https://static.cloudflareinsights.com/beacon.min.js'
            data-cf-beacon='{"token": "f3f00315c93345db8669563782f32513"}'></script>
    <style type="text/css">
        .container {
            display: grid;
            place-items: center;
            height: 90vh;
        }
    </style>
</head>

<body>
    <div class="container">
        <p>Redirecting to <a href="https://heartiqscore.com">HeartIQ Score</a></p>
    </div>
    <script>
        // Served by GitHub Pages for every path that isn't a real file,
        // so this acts as the catch-all (/**) redirect.
        // Carry the original path, query and hash across to the new domain.
        var target = "https://heartiqscore.com"
            + window.location.pathname
            + window.location.search
            + window.location.hash;

        // Wait 1.5 seconds to ensure the analytics beacon has time to fire
        setTimeout(() => {
            window.location.replace(target);
        }, 1500);
    </script>
</body>

</html>
